<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strongest Man">
<meta name="theme-color" content="#0d1b3e">
<title>Strongest Man</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="stylesheet" href="./css/main.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
<canvas id="gl"></canvas>

<!-- speech bubbles project into this layer (inside safe area) -->
<div id="bubbles"></div>

<!-- HUD: everything interactive lives inside the safe-area box -->
<div id="hud" hidden>
  <div id="karma-wrap" aria-label="karma">
    <div id="karma-bar"><div id="karma-fill"></div><div id="karma-tick"></div></div>
    <div id="karma-label">NEUTRAL</div>
  </div>
  <div id="rep-hint" class="hidden"></div>

  <div id="stick"><div id="stick-nub"></div></div>

  <div id="btns">
    <button id="btn-interact" class="abtn small" aria-label="talk">TALK</button>
    <button id="btn-grab" class="abtn small" aria-label="grab or throw">GRAB</button>
    <button id="btn-jump" class="abtn" aria-label="jump">JUMP</button>
    <button id="btn-punch" class="abtn big" aria-label="punch, hold to charge"><span id="charge-ring"></span>PUNCH</button>
  </div>

  <button id="btn-pause" aria-label="pause">II</button>

  <!-- live conversation. Anchored top-left: on iOS the keyboard overlays the
       viewport without resizing it, so a bottom-anchored panel would vanish. -->
  <div id="chat" hidden>
    <div id="chat-head"><span id="chat-who"></span><button id="chat-close" aria-label="end conversation">✕</button></div>
    <div id="chat-log"></div>
    <form id="chat-form" autocomplete="off">
      <input id="chat-input" type="text" placeholder="Say something…" enterkeyhint="send" maxlength="200">
      <button id="chat-send" type="submit">SEND</button>
    </form>
    <div id="chat-hint" class="hidden"></div>
  </div>
  <div id="toast" class="hidden"></div>
</div>

<!-- title / splash -->
<div id="title-screen">
  <img id="title-splash" alt="" src="./assets/img/splash.webp" draggable="false">
  <img id="title-logo" alt="STRONGEST MAN" src="./assets/img/title.webp" draggable="false">
  <div id="title-buttons">
    <button id="btn-play" class="mbtn">PLAY</button>
    <button id="btn-settings" class="mbtn ghost">SETTINGS</button>
  </div>
  <div id="title-tip">Add to Home Screen for fullscreen play</div>
  <div id="title-version"></div>
</div>

<!-- settings -->
<div id="settings-screen" hidden>
  <div id="settings-panel">
    <h2>SETTINGS</h2>
    <label class="srow">Look sensitivity
      <input id="set-sens" type="range" min="0.4" max="2" step="0.05">
      <span id="set-sens-val"></span>
    </label>
    <label class="srow">Invert look Y <input id="set-invy" type="checkbox"></label>
    <label class="srow">Graphics
      <select id="set-quality">
        <option value="high">High — shadows, clouds, sun shafts</option>
        <option value="medium">Medium — shadows, lighter sky</option>
        <option value="low">Low — best framerate</option>
        <option value="auto">Auto — measure this device</option>
      </select>
    </label>
    <label class="srow">Sound <input id="set-audio" type="checkbox"></label>
    <div class="srow key-row">
      <div>Groq API key <span class="hint">optional — powers live NPC dialogue. Stored only on this device, sent only to api.groq.com. Without it NPCs use their built-in lines.</span></div>
      <div class="key-test">
        <input id="set-groq" type="password" placeholder="gsk_..." autocomplete="off">
        <button id="btn-groq-test" type="button" class="mbtn ghost">TEST KEY</button>
      </div>
      <div id="groq-status" class="hint"></div>
    </div>
    <div class="srow btnrow">
      <button id="btn-settings-done" class="mbtn">DONE</button>
    </div>
  </div>
</div>

<!-- pause -->
<div id="pause-screen" hidden>
  <div id="pause-panel">
    <h2>PAUSED</h2>
    <button id="btn-resume" class="mbtn">RESUME</button>
    <button id="btn-pause-settings" class="mbtn ghost">SETTINGS</button>
  </div>
</div>

<!-- rotate overlay: game is landscape-only; iOS can't lock orientation -->
<div id="rotate-overlay" hidden>
  <div id="rotate-inner">
    <div id="rotate-icon">⟳</div>
    <div>Rotate your phone to play</div>
  </div>
</div>

<!-- boot progress -->
<div id="loading">
  <div id="loading-inner">
    <div id="loading-title">STRONGEST&nbsp;MAN</div>
    <div id="loading-bar"><div id="loading-fill"></div></div>
    <div id="loading-msg">loading…</div>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
